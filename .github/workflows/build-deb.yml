name: Build Flowblade .deb Package

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debhelper \
            dh-make \
            build-essential \
            python3-setuptools \
            python3-gi \
            python3-cairo \
            gir1.2-gtk-3.0 \
            libgtk-3-dev \
            libmlt-dev \
            libjson-glib-dev \
            intltool \
            gettext \
            libgirepository1.0-dev \
            pkg-config \
            || { echo "Échec de l'installation des dépendances"; exit 1; }

      - name: Install pip dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pycairo pygobject setuptools wheel || { echo "Échec de l'installation pip"; exit 1; }

      - name: Verify build tools
        run: |
          which debuild || (echo "Installation de debhelper..." && sudo apt-get install -y debhelper)
          which dpkg-deb || (echo "Installation de dpkg..." && sudo apt-get install -y dpkg)
          which make || (echo "Installation de make..." && sudo apt-get install -y make)

      - name: Run build script
        run: |
          chmod +x build_deb.sh
          ./build_deb.sh || { echo "Échec du script build_deb.sh"; exit 1; }

      - name: Verify .deb was created
        run: |
          if ls build/*.deb 1>/dev/null 2>&1; then
            echo "✓ Fichier .deb créé avec succès"
            ls -la build/*.deb
          else
            echo "✗ Aucun fichier .deb trouvé dans build/"
            exit 1
          fi

      - name: Upload .deb as artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowblade-debian-package
          path: "build/flowblade_*.deb"
          retention-days: 90

      - name: Display download instructions
        run: |
          echo "========================================="
          echo " .deb package prêt !"
          echo "========================================="
          echo ""
          echo "Pour installer sur votre Chromebook (Debian 13.7 / Crostini) :"
          echo "1. Téléchargez le fichier ci-dessus depuis l'onglet 'Artifacts'"
          echo "2. Transférez-le vers votre Chromebook via SSH ou scp"
          echo "3. Installez : dpkg -i flowblade_2.20-1_arm64.deb"
          echo ""
          echo "Dépendances requises sur Chromebook :"
          echo "  - libgtk-3-dev, libmlt6, libjson-glib-2.0-0"
          echo "  - python3-gi, python3-cairo, python3-pygobject"
          echo "  - MLT profiles et codecs vidéo selon besoin"
          echo ""
          echo "Ou en ligne de commande :"
          echo "curl -L workflow_artifact_url | dpkg -i /dev/stdin"
          echo "========================================="